<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/jogo.css">
</head>
<body>

<div class="container mt-5">

    <!-- Título -->
    <div class="text-center mb-4">
        <h1 class="titulo">🎮 Gerenciador de Jogos</h1>
        <p class="subtitulo">Cadastre e gerencie seus jogos favoritos</p>
    </div>

    <!-- Barra de busca + botão -->
    <div class="d-flex justify-content-between mb-3">
    

        <button class="btn btn-primary ms-3" data-bs-toggle="modal" data-bs-target="#modalJogo">
            + Novo Jogo
        </button>
    </div>

    <!-- Grid -->
    <div class="table-responsive">
        <table class="table table-hover table-dark tabela-jogos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Gênero</th>
                    <th>Ano</th>
                    <th>Plataforma</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaJogos">
                <!-- Dados virão do JS futuramente -->
               
            </tbody>
        </table>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="modalJogo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content modal-custom">

            <div class="modal-header">
                <h5 class="modal-title">Cadastro de Jogo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form id="formJogo">

                    <input type="hidden" id="id">

                    <div class="mb-3">
                        <label>Nome</label>
                        <input type="text" class="form-control" id="nome"  placeholder="Nome do jogo" required="required">
                    </div>

                    <div class="mb-3">
                        <label>Gênero</label>
                        <select class="form-control" id="genero" required="required">
                            <option>Ação</option>
                            <option>RPG</option>
                            <option>Estratégia</option>
                            <option>Puzzle</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Ano de Lançamento</label>
                        <input type="date" class="form-control" id="ano"  placeholder="Ano do de lançamento" required="required">
                    </div>

                    <div class="mb-3">
                        <label>Plataforma</label>
                        <select class="form-control" id="plataforma" required="required">
                            <option>PC</option>
                            <option>Mobile</option>
                            <option>Console</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Preço</label>
                        <input type="number" class="form-control" id="preco" placeholder="Preço do jogo" required="required">
                    </div>

                </form>

            </div>

            <div class="modal-footer">
                <button class="btn btn-success" type="button" onclick="salvarJogos();">Salvar</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
            </div>

        </div>
    </div>
</div>





<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/jogo.js"></script>

</body>
</html>
