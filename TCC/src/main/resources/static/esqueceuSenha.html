<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Acoa Peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --text: #1a2340; --text2: #4a6080;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:100%; max-width:480px; box-shadow:0 20px 50px rgba(59,111,245,.15); }
    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom: 20px; }
    .form-group label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; }
    .form-group input { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:13.5px; padding:10px 14px; outline:none; }
    .btn { padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; transition:all .15s; }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
    .btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
  </style>
</head>
<body>
  <div class="modal">
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:20px;color:var(--text);">Recuperar Senha</div>
    <div class="form-group">
      <label>E-mail ou CPF</label>
      <input type="text" placeholder="Digite seu E-mail para recuperar">
    </div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-primary" style="flex:1;">Enviar Link</button>
      <a href="login.html" class="btn btn-ghost" style="flex:1;">Voltar</a>
    </div>
  </div>
</body>
</html>
