	<!DOCTYPE html>
	<html lang="pt-BR">
	<head>
	  <meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	  <title>Cadastro - Acoa Peças</title>
	  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
	  
	  <style>
	    :root {
	      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
	      --accent: #3b6ff5; --accent2: #5b8af8; --text: #1a2340; --text2: #4a6080;
	    }
	    * { margin:0; padding:0; box-sizing:border-box; }
	    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
	    .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:100%; max-width:650px; box-shadow:0 20px 50px rgba(59,111,245,.15); transition: max-width 0.3s; }
	    
	    /* Estilização das Abas */
	    .tabs-container { display: flex; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border); }
	    .tab-btn { flex: 1; padding: 10px 14px; border-radius: 8px; border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s ease; }
	    .tab-btn:hover { color: var(--text); }
	    .tab-btn.active { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
	
	    /* Grids de Formulário */
	    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
	    .full-width { grid-column: span 2; }
	    
	    /* Classes de proporção para Número e Complemento juntos */
	    .col-num { grid-column: span 1; }
	    .col-comp { grid-column: span 1; }
	    
	    .form-group { display:flex; flex-direction:column; gap:6px; }
	    .form-group label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
	    .form-group input, .form-group select { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:13.5px; padding:10px 14px; outline:none; transition: border-color 0.2s; width: 100%; font-family: 'DM Sans', sans-serif; }
	    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
	    
	    /* Estilo para campos bloqueados (readonly) */
	    .form-group input[readonly] { background: #e9edf5; color: #7a8ba3; cursor: not-allowed; border-color: var(--border); }
	
	    /* Controle de visibilidade das seções */
	    .tab-content { display: none; }
	    .tab-content.active { display: grid; }
	
	    /* Botões */
	    .btn-container { display: flex; gap: 12px; margin-top: 12px; }
	    .btn { padding:12px 16px; border-radius:10px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; text-decoration:none; }
	    
	    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 12px rgba(59,111,245,.3); }
	    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
	    
	    .btn-ghost { background: #e1e8f5; color: var(--text2); border: 1px solid #c2cfe6; }
	    .btn-ghost:hover { background: #d0daf0; color: var(--text); transform: translateY(-1px); }
	
	    @media (max-width: 500px) {
	      .form-grid { grid-template-columns: 1fr; }
	      .full-width { grid-column: span 1; }
	      .col-num { grid-column: span 1; }
	      .col-comp { grid-column: span 1; }
	    }
	  </style>
	</head>
	<body>
	  <div class="modal">
	    <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:20px;color:var(--text);">Criar Conta</div>
	    
	    <div class="tabs-container">
	      <button class="tab-btn active"  id=usuario>👤 Usuário</button>
	   
	    </div>
	
	    <form id="cadastroForm" onsubmit="salvar(event)">
	      <input type="hidden" id="tipo_conta" name="tipo_conta" value="usuario">
	
	      <div id="conteudo-usuario" class="tab-content active form-grid">
	        <div class="form-group full-width">
	        <label>Nome</label>
	        <input type="text" id="nome" name="nome" placeholder="Seu nome completo"  required="required"  >
	        </div>
	        
	        
	        <div class="form-group">
	        <label>Telefone</label>
	        <input type="tel" id="telefone_usuario" name="telefone_usuario" placeholder="(00) 00000-0000"  required="required" oninput="mascaraTelefone(this)" maxlength="15">
	        </div>
	        
	        
	        <div class="form-group">
	        <label>Email</label>
	        <input type="email" id="email_usuario" name="email_usuario" placeholder="email@exemplo.com" required="required" maxlength="100">
	        </div>
	        
	        
	        
	        <div class="form-group">
	        <label>CPF</label>
	        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"   required="required"  oninput="aplicarMascaraCPF(event)" maxlength="14">
	        </div>
	        
	        <div class="form-group">
	          <label>Cargo</label>
	          <select name="cargo" id="cargo" required="required">
	            <option value="" disabled selected>Selecione seu cargo</option>
	            <option value="mecanico">Mecânico</option>
	            <option value="almoxarife">Almoxarife</option>
	          </select>
	        </div>
	        
	        <div class="form-group">
	        <label>Senha</label>
	        <input type="password" class="senha-field" id="senha" name="senha" placeholder="Crie uma senha"  required="required">
	        </div>
	        
	        
	        <div class="form-group">
	        <label>Confirmar Senha</label>
	        <input type="password" class="confirmar-senha-field" id="confirmaSenha" placeholder="Repita a senha" required="required">
	        </div>
	        
	        <div class="form-group full-width">
	        <label>Data de Cadastro</label>
	        <input type="text" class="data-cadastro-input"  id ="dataCadastro"readonly  onsubmit="dataHoje();">
	        </div>
	        
	        
	      </div>
	
	       
	      
	      <div class="btn-container full-width">
	        <button type="submit" class="btn btn-primary" style="flex:1;" onclick="">Cadastrar</button>
	        <a href="login.html" class="btn btn-ghost" style="flex:1;">Voltar ao Login</a>
	      </div>
	    </form>
	  </div>
	  <script src="JS/cadastro.js"></script>
	
	 
	</body>
	</html>
