<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Acoa Peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --text: #1a2340; --text2: #4a6080;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:100%; max-width:560px; box-shadow:0 20px 50px rgba(59,111,245,.15); }
    .form-grid { display:grid; gap:16px; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
    .form-group input, .form-group select { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:13.5px; padding:10px 14px; outline:none; }
    .btn { padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; text-decoration:none; }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 12px rgba(59,111,245,.3); }
    .btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
  </style>
</head>
<body>
  <div class="modal">
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:20px;color:var(--text);">Criar Conta</div>
    <div class="form-grid">
      <div class="form-group"><label>Tipo de Conta</label>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-ghost" style="flex:1;background:#e3f2fd;color:#1976d2;font-weight:600;">👤 Usuário</button>
          <button class="btn btn-ghost" style="flex:1;">🏭 Fornecedor</button>
          <button class="btn btn-ghost" style="flex:1;">🚗 Cliente</button>
        </div>
      </div>
      <div class="form-group"><label>Nome Completo</label><input type="text" placeholder="Seu nome"></div>
      <div class="form-group"><label>CPF / CNPJ</label><input type="text" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Senha</label><input type="password" placeholder="Crie uma senha"></div>
      <div style="display:flex;gap:12px;">
        <button class="btn btn-primary" style="flex:1;">Cadastrar</button>
        <a href="login.html" class="btn btn-ghost" style="flex:1;">Voltar ao Login</a>
      </div>
    </div>
  </div>
</body>
</html>
