<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fornecedores - Acoa Peças</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --accent-light: #dce8ff;
      --success: #22c55e; --danger: #ef4444; --text: #1a2340; --text2: #4a6080; --text3: #8fa0b8; --sidebar-w: 240px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
    a { text-decoration: none; }
    #app { display: flex; height: 100%; }
    #sidebar { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; box-shadow: 2px 0 12px rgba(59,111,245,.06); }
    .logo-area { padding:24px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; }
    nav { padding:16px 12px; flex:1; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; color:var(--text2); margin-bottom:2px; transition:all .15s; }
    .nav-item:hover, .nav-item.active { background:var(--accent-light); color:var(--accent); }
    #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar-base { height:64px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 28px; box-shadow: 0 2px 8px rgba(59,111,245,.05); }
    #content { flex:1; overflow-y:auto; padding:28px; }
    
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow: 0 2px 10px rgba(59,111,245,.06); }
    
    /* Novo layout do cabeçalho do Cartão */
    .card-header-custom { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; margin: 0; }
    
    /* Barra de busca reduzida exatamente como no modelo */
    .search-box { display: flex; gap: 8px; align-items: center; }
    .search-box input { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; width: 100%; max-width: 250px; background: var(--surface2); height: 38px; }
    .search-box input:focus { border-color: var(--accent); background: var(--surface); }
    
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    thead th { text-align:center; padding:10px 14px; font-size:11px; text-transform:uppercase; color:var(--text3); border-bottom:1px solid var(--border); background:var(--surface2); }
    tbody td { text-align:center; padding:12px 14px; color:var(--text2); border-bottom:1px solid var(--border); vertical-align: middle; }
    
    .btn-primary { padding:0 16px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:500; background:var(--accent); color:#fff; height: 38px; display: inline-flex; align-items: center; }
    .btn-success { background:var(--success); color:#fff; padding: 0 16px; font-size: 13px; font-weight: 600; border-radius: 10px; border: none; height: 36px; display: inline-flex; align-items: center; }
    .btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); padding:0 16px; border-radius:8px; font-size:12px; font-weight: 500; height: 38px; display: inline-flex; align-items: center; }
    .btn-ghost:hover { background: var(--border); }
    .nav-label { font-size:10px; letter-spacing:1.8px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; padding:0 8px; }
    .btn-danger { background:rgba(239,68,68,.1); color:var(--danger); padding:6px 12px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight: 500;}
    .btn-danger:hover { background:rgba(239,68,68,.2); }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo-area">
          <div class="logo-icon">⚙️</div>
          <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;">SISCAP</div></div>
      </div>
      <nav>
        <div class="nav-label">Principal</div>
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <div class="nav-label">Estoque</div>
        <a href="pecas.html" class="nav-item">🔩 Peças</a>
        <a href="kits.html" class="nav-item">📶 Equipamentos</a>
        <div class="nav-label">Oficina</div>
        <a href="os.html" class="nav-item">📝 Abrir Ordem de Serviço</a>
        <a href="manutencao.html" class="nav-item">🛠️ Manutenções</a>
        <a href="retirada.html" class="nav-item">📤 Ordem de retirada</a>
        <div class="nav-label">Fornecedores</div>
        <a href="fornecedores.html" class="nav-item active">🏭 Fornecedores</a>
        <div class="nav-label">Clientes</div>
        <a href="clientes.html" class="nav-item">👥 Clientes</a>
       
      </nav>
    </aside>

    <main id="main">
      <header class="topbar-base">
          <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;">Gestão de Fornecedores</div>
      </header>
      
      <div id="content">
        <div class="card">
          
          <div class="card-header-custom">
            <div class="card-title-row">
              <h2 class="card-title">Lista de Fornecedores</h2>
              <button class="btn-success" onclick="abrirModal()">⚡ Criar Fornecedor</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="filtroNome" placeholder="🔍 Digite para pesquisar...">
                <button class="btn-primary" onclick="buscarFornecedor()">Buscar</button>
                <button class="btn-ghost" onclick="document.getElementById('filtroNome').value=''; buscarFornecedor();">Limpar</button>
            </div>
          </div>
          <table>
            <thead>
                <tr>
                    <th>Razão Social</th>
                    <th>CNPJ</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="fornecedorTableBody">
              </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="fornecedorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="font-family:'Syne',sans-serif; font-weight:700;">Salvar Fornecedor</h5>
          <button type="button" class="btn-close" onclick="fecharModal()"></button>
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="razaoSocial" class="form-label">Razão Social</label>
                    <input type="text" class="form-control" id="razaoSocial" placeholder="Ex: Auto Peças Oliveira LTDA">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <input type="text" class="form-control" id="cnpj" placeholder="00.000.000/0000-00">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone" placeholder="(00) 0000-0000">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="contato@empresa.com.br">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" placeholder="00000-000">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="complemento" class="form-label">Complemento</label>
                    <input type="text" class="form-control" id="complemento" placeholder="Sala, Galpão, etc.">
                </div>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" onclick="fecharModal()">Cancelar</button>
          <button type="button" class="btn-primary" onclick="salvarFornecedor()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="JS/Fornecedor.js"></script>
</body>
</html>
