<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Acoa Peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --accent-light: #dce8ff;
      --success: #22c55e; --danger: #ef4444; --text: #1a2340; --text2: #4a6080; --text3: #8fa0b8; --sidebar-w: 240px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
    #app { display: flex; height: 100%; }
    #sidebar { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; box-shadow: 2px 0 12px rgba(59,111,245,.06); }
    .logo-area { padding:24px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; }
    nav { padding:16px 12px; flex:1; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; color:var(--text2); text-decoration:none; margin-bottom:2px; transition:all .15s; }
    .nav-item:hover, .nav-item.active { background:var(--accent-light); color:var(--accent); }
    #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar-base { height:64px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 28px; box-shadow: 0 2px 8px rgba(59,111,245,.05); }
    #content { flex:1; overflow-y:auto; padding:28px; }
    
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow: 0 2px 10px rgba(59,111,245,.06); }
    .card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
    
    /* Toolbar de pesquisa compacta alinhada abaixo do título */
    .table-toolbar { display: flex; gap: 8px; margin-bottom: 24px; align-items: center; }
    .table-toolbar input { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; width: 100%; max-width: 250px; background: var(--surface2); height: 38px; }
    .table-toolbar input:focus { border-color: var(--accent); background: var(--surface); }

    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    thead th { text-align:center; padding:10px 14px; font-size:11px; text-transform:uppercase; color:var(--text3); border-bottom:1px solid var(--border); background:var(--surface2); }
    tbody td { text-align:center; padding:12px 14px; color:var(--text2); border-bottom:1px solid var(--border); vertical-align: middle; }
    
    .btn { padding:6px 12px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:500; transition: all 0.2s; height: 38px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background:var(--accent); color:#fff; padding: 0 16px; }
    .btn-primary:hover { background:var(--accent2); }
    .btn-success { background:var(--success); color:#fff; padding: 0 16px; font-size: 13px; font-weight: 600; border-radius: 10px; height: 36px; }
    .btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); padding: 0 16px; }
    .btn-ghost:hover { background: var(--border); }
    .btn-danger { background:rgba(239,68,68,.1); color:var(--danger); padding:6px 12px; border-radius:8px; border:none; cursor:pointer; font-size:12px; height: auto; }
    .btn-danger:hover { background:rgba(239,68,68,.2); }
    .nav-label { font-size:10px; letter-spacing:1.8px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; padding:0 8px; }
    
    /* Estilos do Modal Customizado */
    .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 999; }
    .custom-modal.active { display: flex; }
    .modal-content { background: var(--surface); border-radius: 14px; width: 500px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border); }
    .modal-header { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; }
    .modal-close { cursor: pointer; font-size: 18px; color: var(--text3); }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; color: var(--text2); font-weight: 500; }
    .form-group input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--surface2); outline: none; }
    .form-group input:focus { border-color: var(--accent); background: var(--surface); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo-area"><div class="logo-icon">⚙️</div><div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;">SISCAP</div></div></div>
      <nav>
        <div class="nav-label">Principa</div>
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <div class="nav-label">Estoque</div>
        <a href="pecas.html" class="nav-item">🔩 Peças</a>
        <a href="kits.html" class="nav-item">📶 Equipamentos</a>
        <div class="nav-label">Oficina</div>
        <a href="os.html" class="nav-item">📝 Abrir Ordem de Serviço</a>
        <a href="manutencao.html" class="nav-item">🛠️ Manutenções</a>
        <a href="retirada.html" class="nav-item">📤 Ordem de retirada</a>
        <div class="nav-label">Fornecedores</div>
        <a href="fornecedores.html" class="nav-item">🏭 Fornecedores</a>
        <div class="nav-label">Clientes</div>
        <a href="clientes.html" class="nav-item active">👥 Clientes</a>
       
      </nav>
    </aside>

    <main id="main">
      <header class="topbar-base"><div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;">Gestão de Clientes</div></header>
      <div id="content">

        <div class="card">
          <div class="card-title">
            <span>Lista de Clientes</span> 
            <button class="btn btn-success" onclick="abrirModal()">⚡ Criar Cliente</button>
          </div>
          
          <div class="table-toolbar">
            <input type="text" id="filtroNome" placeholder="🔍 Digite para pesquisar...">
            <button class="btn btn-primary" onclick="buscarCliente()">Buscar</button>
            <button class="btn btn-ghost" onclick="document.getElementById('filtroNome').value=''; buscarCliente();">Limpar</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>Nome / Razão Social</th>
                <th>CPF / CNPJ</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="clienteTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="clienteModal" class="custom-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitulo" style="font-family:'Syne',sans-serif; font-weight:700;">Adicionar Novo Cliente</span>
        <span class="modal-close" onclick="fecharModal()">&times;</span>
      </div>
      <form id="clienteForm">
        <div class="form-group">
          <label>Nome / Razão Social</label>
          <input type="text" id="razaoSocial" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>CPF / CNPJ</label>
            <input type="text" id="cpf_cnpj" required>
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="telefone">
          </div>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>CEP</label>
            <input type="text" id="cep">
          </div>
          <div class="form-group">
            <label>Número</label>
            <input type="text" id="numero">
          </div>
        </div>
        <div class="form-group">
          <label>Complemento</label>
          <input type="text" id="complemento">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" style="height: 38px;" onclick="fecharModal()">Cancelar</button>
          <button type="button" class="btn btn-primary" style="height: 38px;" onclick="salvarCliente()">Salvar</button>
        </div>
      </form>
    </div>
  </div>

<script type="text/javascript" src="JS/clientes.js"></script>
</body>
</html>
