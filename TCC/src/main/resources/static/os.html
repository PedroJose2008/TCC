<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir OS - Acoa Peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --accent-light: #dce8ff;
      --text: #1a2340; --text2: #4a6080; --text3: #8fa0b8; --sidebar-w: 240px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
    #app { display: flex; height: 100%; }
    #sidebar { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; box-shadow: 2px 0 12px rgba(59,111,245,.06); }
    .logo-area { padding:24px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; }
    nav { padding:16px 12px; flex:1; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; color:var(--text2); text-decoration:none; margin-bottom:2px; transition:all .15s; }
    .nav-item:hover, .nav-item.active { background:var(--accent-light); color:var(--accent); }
    #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar-base { height:64px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 28px; box-shadow: 0 2px 8px rgba(59,111,245,.05); }
    #content { flex:1; overflow-y:auto; padding:28px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow: 0 2px 10px rgba(59,111,245,.06); }
    .card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; margin-bottom:16px; }
    .form-grid { display:grid; gap:16px; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; }
    .form-group input, .form-group select, .form-group textarea { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:13.5px; padding:10px 14px; outline:none; }
    .btn-primary { padding:10px 16px; border-radius:10px; border:none; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; transition:all .15s; }
  
   	    .nav-label { font-size:10px; letter-spacing:1.8px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; padding:0 8px; }
  
  
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(59,111,245,.3); }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo-area"><div class="logo-icon">⚙️</div><div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;">ACOA PEÇAS</div></div></div>
      <nav>
        <div class="nav-label">Principal</div>
        <a href="dashboard.html" class="nav-item active">📊 Dashboard</a>
        <div class="nav-label">Estoque</div>
        <a href="pecas.html" class="nav-item">🔩 Peças</a>
        <a href="kits.html" class="nav-item">📶 Kits</a>
        <div class="nav-label">Oficina</div>
        <a href="os.html" class="nav-item">📝 Abrir Ordem de Serviço</a>
        <a href="manutencao.html" class="nav-item">🛠️ Manutenções</a>
		<a href="retirada.html" class="nav-item">📤 Ordem de retirada</a>
		
		<div class="nav-label">Compras</div>       
       <a href="reposicao.html" class="nav-item">🛒 Reposição</a>
        <div class="nav-label">Fornecedores</div>
	<a href="fornecedores.html" class="nav-item">🏭 Fornecedores</a>
		        
    <div class="nav-label">Clientes</div>
		<a href="clientes.html" class="nav-item">👥 Clientes</a>
		    
        
        
        
        
        
      
        <a href="login.html" class="nav-item" style="margin-top:20px; color:var(--danger)">🚪 Sair</a>
        
      </nav>
    </aside>
    <main id="main">
      <header class="topbar-base"><div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;">Abertura de Ordem de Serviço</div></header>
      <div id="content">
        <div class="card">
          <div class="card-title">📝 Nova OS</div>
          <div class="form-grid">
            <div class="form-group"><label>Tipo de OS</label><select><option value="externa">Cliente Externo</option><option value="interna">Manutenção Interna</option></select></div>
            <div class="form-group"><label>Nome do Cliente / Setor</label><input type="text" placeholder="Digite o nome..."></div>
            <div class="form-group"><label>Peças para Manutenção</label><textarea rows="3" placeholder="Ex: 1x Bomba D'Água, 2x Filtros..."></textarea></div>
            <div class="form-group"><label>Mecânico Responsável</label><select><option>Carlos Mendes</option><option>Roberto Silva</option></select></div>
            <button class="btn-primary">Abrir Ordem de Serviço</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
