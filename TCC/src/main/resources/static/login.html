<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Acoa Peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f8; --surface: #ffffff; --surface2: #f0f4fb; --border: #d6dff0;
      --accent: #3b6ff5; --accent2: #5b8af8; --text: #1a2340; --text2: #4a6080; --text3: #8fa0b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { height:100vh; font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
    #login-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); overflow:hidden; }
    #login-overlay::before, #login-overlay::after { content:''; position:absolute; border-radius:50%; background:rgba(59,111,245,.07); }
    #login-overlay::before { width:340px; height:340px; top:-80px; right:-60px; }
    #login-overlay::after { width:220px; height:220px; bottom:-60px; right:80px; }
    .login-container { display:flex; width:900px; max-width:96vw; min-height:540px; border-radius:28px; overflow:hidden; box-shadow: 0 24px 60px rgba(59,111,245,.18); position:relative; z-index:1; }
    .login-left { flex:0 0 420px; background:linear-gradient(145deg, #6fa0e8 0%, #4a7fd4 60%, #3b6ff5 100%); padding:48px 44px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden; }
    .login-left::before { content:''; position:absolute; width:480px; height:480px; border-radius:50%; background:rgba(255,255,255,.1); top:50%; left:50%; transform:translate(-50%,-50%); }
    .login-left::after { content:'⚙'; position:absolute; font-size:160px; bottom:-30px; left:-30px; color:rgba(255,255,255,.12); line-height:1; pointer-events:none; }
    .login-left-inner { position:relative; z-index:1; }
    .login-welcome { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; color:#fff; margin-bottom:8px; text-align:center; }
    .login-subtitle { font-size:13px; color:rgba(255,255,255,.8); margin-bottom:36px; text-align:center; }
    .login-field { background:rgba(255,255,255,.92); border:none; border-radius:50px; color:var(--text); font-size:13.5px; padding:12px 20px; outline:none; width:100%; margin-bottom:12px; font-family:'DM Sans',sans-serif; box-shadow:0 2px 8px rgba(0,0,0,.08); transition:box-shadow .15s; }
    .login-field-label { font-size:12px; font-weight:600; color:rgba(255,255,255,.7); margin-bottom:4px; padding-left:4px; display:block; }
    .btn-login { width:100%; padding:13px; border-radius:50px; border:none; cursor:pointer; background:linear-gradient(135deg,#3b6ff5,#5b8af8); color:#fff; font-size:14px; font-weight:700; font-family:'DM Sans',sans-serif; box-shadow:0 6px 20px rgba(59,111,245,.45); transition:all .15s; margin-top:4px; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(59,111,245,.55); }
    .login-divider { display:flex; align-items:center; gap:12px; color:rgba(255,255,255,.5); font-size:12px; margin:16px 0 8px; }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.25); }
    .login-links { text-align:center; }
    .login-link { color:rgba(255,255,255,.9); font-size:13px; cursor:pointer; text-decoration:none; display:block; margin-bottom:6px; transition:color .15s; }
    .login-link:hover { color:#fff; text-decoration:underline; }
    .login-right { flex:1; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 44px; position:relative; overflow:hidden; }
    .login-right::before { content:'⚙'; position:absolute; font-size:220px; top:-40px; right:-40px; color:rgba(59,111,245,.06); line-height:1; pointer-events:none; }
    .login-right::after { content:'⚙'; position:absolute; font-size:160px; bottom:-30px; right:60px; color:rgba(59,111,245,.05); line-height:1; pointer-events:none; }
    .login-brand { position:relative; z-index:1; text-align:center; }
    .login-brand-logo { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; }
    .login-brand-icon { font-size:64px; line-height:1; }
    .login-brand-name { font-family:'Syne',sans-serif; font-size:42px; font-weight:800; color:var(--text); line-height:1.1; }
    .login-brand-line { width:80px; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; margin:12px auto 16px; }
    .login-brand-tagline { font-size:14px; color:var(--text2); line-height:1.6; max-width:260px; }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div class="login-container">
      <div class="login-left">
        <div class="login-left-inner">
          <div class="login-welcome">Bem vindo de volta!</div>
          <div class="login-subtitle">Faça login para acessar sua conta.</div>
          <div>
          <form action="">
            <label class="login-field-label">Email:</label>
            <input type="text" class="login-field" placeholder="Digite seu email" id="email" required="required">
            
            <label class="login-field-label">Senha:</label>
            <input type="password" class="login-field" placeholder="Sua senha" id="senha" required="required">
            </form>
            <button class="btn-login" onclick="login();">Entrar no Sistema</button>
            <div class="login-divider">OU</div>
            <div class="login-links">
              <a href="esqueceu-senha.html" class="login-link">Esqueceu sua senha?</a>
              <a href="cadastro.html" class="login-link">Não tem conta? Cadastre-se</a>
            </div>
          </div>
        </div>
      </div>
      <div class="login-right">
        <div class="login-brand">
          <div class="login-brand-logo">
            <div class="login-brand-icon">⚙️</div>
            <div class="login-brand-name">SISCAP<br></div>
          </div>
          <div class="login-brand-line"></div>
          <div class="login-brand-tagline">               Sistema de Cadastro de Peças</div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="text/javascript" src="JS/login.js"></script>
  
</body>
</html>
